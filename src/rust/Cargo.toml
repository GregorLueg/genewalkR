[package]
name = 'genewalkR'
publish = false
version = '0.1.7'
edition = '2021'
rust-version = '1.85'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'genewalkR'

# I want aggressive optimisation also during testing
[profile.test]
opt-level = 3
debug = false

[profile.dev]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
ann-search-rs = "0.2.15"
bixverse-rs = "0.2.0"
extendr-api = "0.9.0"
faer = "0.23.2"
fastrand = "2.3.0"
itertools = "0.14.0"
node2vec-rs = "0.1.6"
num-traits = "0.2.19"
rand = "0.9.2"
rayon = "1.11.0"
rustc-hash = "2.1.1"


[lints.rust]
non_snake_case = "allow"

[[bin]]
name = "document"
path = "document.rs"
