[package]
name = 'genewalkR'
publish = false
version = '0.2.0'
edition = '2021'
rust-version = '1.90'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'genewalkR'

[profile.test]
opt-level = 2
debug = false

[profile.dev]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.release]
lto = "thin"
codegen-units = 4

[dependencies]
ann-search-rs = "0.8.3"
bixverse-rs = "0.5.0"
extendr-api = "0.9.0"
faer = "0.23.2"
fastrand = "2.3.0"
itertools = "0.14.0"
node2vec-rs = "0.3.0"
num-traits = "0.2.19"
rand = "0.9.2"
rayon = "1.11.0"
rustc-hash = "2.1.1"


[lints.rust]
non_snake_case = "allow"

[[bin]]
name = "document"
path = "document.rs"

#########
# Patch #
#########

[patch.crates-io]
node2vec-rs = { git = "https://github.com/GregorLueg/node2vec-rs", branch = "feat-metapath2vec" }
